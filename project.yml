name: OverseaBili
options:
  bundleIdPrefix: com.lfkdsk
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R6QM7B7GB7
targets:
  OverseaBili:
    type: application
    platform: tvOS
    sources:
      - OverseaBili
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfkdsk.OverseaBili
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    info:
      path: OverseaBili/Info.plist
      properties:
        CFBundleDisplayName: 海外哔哩
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lfkdsk.OverseaBili.play
            CFBundleURLSchemes: [overseabili]
